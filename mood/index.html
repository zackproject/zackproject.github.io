<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mood</title>
    <link rel="icon" href="icopz.ico" />
    <meta name="robots" content="noindex, nofollow" />
  </head>
  <body>
    <input type="file" id="csvFile" accept=".csv" />
    <div id="main"></div>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
        margin: 0 auto;
        max-width: 900px;
      }
      h1 {
        font-size: 1.5em;
        margin-bottom: 0;
      }
      h2 {
        font-size: 1.2em;
        margin-bottom: 5px;
        margin-top: 15px;
      }
      p {
        font-size: 1em;
        line-height: 1.4;
      }
      #main > article {
        border-bottom: 1px solid #ccc;
        margin-bottom: 15px;
      }
    </style>
    <script>
      function capitalize(str) {
        return str.charAt(0).toUpperCase() + str.slice(1);
      }
      function reverseDate(dateStr) {
        const parts = dateStr.split("-");
        return `${parts[2]}-${parts[1]}-${parts[0]}`;
      }
      function emotionToEmoji(emotion) {
        switch (emotion.toLowerCase()) {
          case "increíble":
            return "🤩";
          case "bien":
            return "🙂";
          case "meh":
            return "😐";
          case "mal":
            return "😢";
          case "horrible":
            return "😖";
        }
      }

      document
        .getElementById("csvFile")
        .addEventListener("change", function (e) {
          const file = e.target.files[0];
          if (!file) return;

          const reader = new FileReader();

          reader.onload = function (event) {
            const text = event.target.result;
            const rows = text
              .trim()
              .split("\n")
              .map((r) => r.replace(/\r/g, "").split(","));

            const main = document.getElementById("main");
            main.innerHTML = "";

            for (let i = rows.length - 1; i > 0; i--) {
              const row = rows[i];

              const div = document.createElement("article");

              const h1 = document.createElement("h1");
              h1.innerText = `${capitalize(row[2])} ${reverseDate(row[0])}`;

              const pMood = document.createElement("p");
              pMood.innerText = `${emotionToEmoji(row[4])} ${row[4]} — ${row[5].replace(/"/g, "")}`;
              const h2Note = document.createElement("h2");
              h2Note.innerText = "Descripción";

              const pNote = document.createElement("p");
              let acum = "";
              for (let i = 6; i < row.length; i++) {
                const element = row[i];
                if (element && element.trim() !== "") {
                  acum += element + ", ";
                }
              }
              console.log(acum);
              acum = acum.replace(/"/g, "");
              acum = acum.replace("<br><br>", "<br>");
              acum = acum.replace(", ,", "");
              acum = acum.replace(".,", ".");

              pNote.innerHTML = acum;

              div.append(h1, pMood, h2Note, pNote);
              main.appendChild(div);
            }
          };

          reader.readAsText(file);
        });
    </script>
  </body>
</html>
